name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Lint web and shared code
        run: npm run lint
      - name: Audit production web dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Test web and shared logic
        run: npm test
      - name: Build web application
        run: npm run build
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Audit production server dependencies
        working-directory: server
        run: npm audit --omit=dev --audit-level=high
      - name: Type-check server
        working-directory: server
        run: npm run typecheck
      - name: Build server
        working-directory: server
        run: npm run build
