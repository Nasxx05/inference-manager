# AgentFund — Render blueprint
#
# Deploy: Dashboard > New > Blueprint, point at your GitHub repo.
# Render reads this file and creates the service automatically.
#
# The API key below has no value on purpose. Render will prompt you to
# enter it the first time you deploy, and it is stored encrypted in
# Render's environment. Never commit a real key here.

services:
  - type: web
    name: agentfund
    runtime: node
    plan: free
    region: oregon

    # Render builds with `npm install` (no dependencies) and starts with `npm start`.
    buildCommand: npm install
    startCommand: npm start

    healthCheckPath: /api/health

    envVars:
      - key: NODE_VERSION
        value: "18"

      - key: AGENTFUND_BASE_URL
        sync: false

      - key: AGENTFUND_API_KEY
        sync: false

      - key: AGENTFUND_MODEL
        sync: false

      # Render supplies PORT automatically; declared here for clarity.
      - key: PORT
        value: "10000"